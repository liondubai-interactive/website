<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LionDubai — Mobile preview</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { display: grid; place-items: center; background: #e8e9ed; }
    .stage { position: relative; width: calc(410px * var(--scale, 1)); height: calc(864px * var(--scale, 1)); }
    .phone {
      position: absolute; width: 410px; height: 864px;
      padding: 10px; border-radius: 48px; background: #202126;
      box-shadow: 0 0 0 1px #53555d, 0 24px 64px #20212630;
      transform: scale(var(--scale, 1)); transform-origin: top left;
    }
    iframe { display: block; width: 390px; height: 844px; border: 0; border-radius: 38px; background: #f7f7f9; }
  </style>
</head>
<body>
  <main class="stage" aria-label="Mobile website preview">
    <div class="phone"><iframe src="/" title="LionDubai website — 390 by 844 phone screen"></iframe></div>
  </main>
  <script>
    function fitPhone() {
      const scale = Math.max(.1, Math.min(1, (innerWidth - 48) / 410, (innerHeight - 48) / 864));
      document.documentElement.style.setProperty("--scale", scale);
    }
    fitPhone();
    addEventListener("resize", fitPhone);
  </script>
</body>
</html>
